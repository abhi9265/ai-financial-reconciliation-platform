<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><rect width="1400" height="650" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#102a5c}.t{font-size:28px;font-weight:700}.h{font-size:17px;font-weight:700}.b{font-size:13px}.s{font-size:11px;fill:#475569}.row{fill:white;stroke:#cbd5e1;stroke-width:2}.pill{fill:#eef6ff;stroke:#cfe1f5}</style><text x="50" y="48" class="t">3. Reconciliation &amp; Matching Logic</text><text x="50" y="73" class="s">Layered matching strategy designed for accuracy first, then scalability and controlled ambiguity</text>
<g transform="translate(50,115)"><rect class="row" width="760" height="68" rx="12"/><circle cx="34" cy="34" r="22" fill="#dbeafe"/><text x="34" y="40" text-anchor="middle" class="h">1</text><text x="75" y="29" class="h">Candidate Blocking</text><text x="75" y="49" class="s">Generate a small, relevant candidate set instead of comparing every record pair.</text></g>
<g transform="translate(50,195)"><rect class="row" width="760" height="68" rx="12"/><circle cx="34" cy="34" r="22" fill="#dbeafe"/><text x="34" y="40" text-anchor="middle" class="h">2</text><text x="75" y="29" class="h">Exact Match</text><text x="75" y="49" class="s">Reference, transaction ID, amount, date and other deterministic keys.</text></g>
<g transform="translate(50,275)"><rect class="row" width="760" height="68" rx="12"/><circle cx="34" cy="34" r="22" fill="#dbeafe"/><text x="34" y="40" text-anchor="middle" class="h">3</text><text x="75" y="29" class="h">Fuzzy Match</text><text x="75" y="49" class="s">Description similarity, amount tolerance and date-window logic for noisy records.</text></g>
<g transform="translate(50,355)"><rect class="row" width="760" height="68" rx="12"/><circle cx="34" cy="34" r="22" fill="#dbeafe"/><text x="34" y="40" text-anchor="middle" class="h">4</text><text x="75" y="29" class="h">One-to-Many / Partial</text><text x="75" y="49" class="s">Split payments, invoice bundles and partial settlements.</text></g>
<g transform="translate(50,435)"><rect class="row" width="760" height="68" rx="12"/><circle cx="34" cy="34" r="22" fill="#dbeafe"/><text x="34" y="40" text-anchor="middle" class="h">5</text><text x="75" y="29" class="h">Complex Match Handling</text><text x="75" y="49" class="s">Bounded candidate sets prevent combinatorial explosion on adversarial cases.</text></g>
<g transform="translate(50,515)"><rect class="row" width="760" height="68" rx="12"/><circle cx="34" cy="34" r="22" fill="#dbeafe"/><text x="34" y="40" text-anchor="middle" class="h">6</text><text x="75" y="29" class="h">Decision</text><text x="75" y="49" class="s">Auto-match only when deterministic evidence meets confidence thresholds.</text></g>
<g transform="translate(870,115)"><rect class="pill" width="460" height="468" rx="16"/><text x="25" y="36" class="h">Illustrative Matching Example</text><rect x="25" y="65" width="175" height="58" rx="9" fill="white" stroke="#cbd5e1"/><text x="40" y="89" class="b">Bank transaction</text><text x="40" y="108" class="s">₹10,000 • ACME Corp</text><rect x="260" y="65" width="175" height="58" rx="9" fill="white" stroke="#cbd5e1"/><text x="275" y="89" class="b">Invoice INV-001</text><text x="275" y="108" class="s">₹10,000 • ACME Corp</text><path d="M200 94h60" stroke="#16a34a" stroke-width="4"/><text x="210" y="82" class="s">Exact</text><rect x="25" y="160" width="175" height="58" rx="9" fill="white" stroke="#cbd5e1"/><text x="40" y="184" class="b">₹5,000 payment</text><text x="40" y="203" class="s">ACME Corp</text><rect x="260" y="160" width="175" height="58" rx="9" fill="white" stroke="#cbd5e1"/><text x="275" y="184" class="b">Invoice INV-002</text><text x="275" y="203" class="s">₹12,500 • ACME Corp</text><path d="M200 190h60" stroke="#7c3aed" stroke-width="4"/><text x="205" y="178" class="s">Partial</text><rect x="25" y="255" width="410" height="110" rx="10" fill="white" stroke="#cbd5e1"/><text x="40" y="282" class="h">Scale safeguard</text><text x="40" y="306" class="s">Candidate blocking can reduce the search space</text><text x="40" y="327" class="s">by 99.9926% in the measured 500K benchmark.</text><text x="40" y="348" class="s">Complex candidates are explicitly bounded.</text><rect x="25" y="390" width="410" height="58" rx="10" fill="#e8f8ed" stroke="#74c69d"/><text x="40" y="415" class="b">Measured safety outcome</text><text x="40" y="434" class="s">0 false auto-matches in benchmark evidence</text></g></svg>