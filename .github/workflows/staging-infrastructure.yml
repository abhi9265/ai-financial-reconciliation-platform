name: Staging Infrastructure Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/aws/staging/**"
      - "src/reconciliation_platform/config.py"
      - ".github/workflows/staging-infrastructure.yml"
  push:
    branches: [main]
    paths:
      - "infra/aws/staging/**"
      - "src/reconciliation_platform/config.py"
      - ".github/workflows/staging-infrastructure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/aws/staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  configuration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --tag staging-config-check .

      - name: Verify managed database configuration path
        run: |
          docker run --rm             -e DATABASE_HOST=postgres.example.internal             -e DATABASE_USER=reconciliation             -e DATABASE_PASSWORD='test password/with-specials'             -e DATABASE_NAME=reconciliation             staging-config-check             python -c "from reconciliation_platform.config import Settings; s=Settings.from_env(); assert s.database_url == 'postgresql://reconciliation:test%20password%2Fwith-specials@postgres.example.internal:5432/reconciliation'; print('managed database configuration: OK')"
