<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680">
<rect width="1400" height="680" fill="#ffffff"/>
<text x="60" y="60" font-family="Arial" font-size="32" font-weight="700" fill="#0f172a">02 · Data Engineering and Reconciliation Flow</text>
<text x="60" y="92" font-family="Arial" font-size="18" fill="#475569">Source-specific complexity is absorbed before matching begins</text>
<g font-family="Arial">
<rect x="60" y="145" width="240" height="145" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="95" cy="180" r="20" fill="#2563eb"/><text x="95" y="187" text-anchor="middle" font-size="15" font-weight="700" fill="white">01</text><text x="130" y="182" font-size="19" font-weight="700" fill="#0f172a">Raw financial data</text><text x="85" y="225" font-size="14" fill="#475569">CSV • Excel • PDF • APIs</text><rect x="330" y="145" width="240" height="145" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="365" cy="180" r="20" fill="#2563eb"/><text x="365" y="187" text-anchor="middle" font-size="15" font-weight="700" fill="white">02</text><text x="400" y="182" font-size="19" font-weight="700" fill="#0f172a">Validate + parse</text><text x="355" y="225" font-size="14" fill="#475569">Schema • types • quality • errors</text><rect x="600" y="145" width="240" height="145" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="635" cy="180" r="20" fill="#2563eb"/><text x="635" y="187" text-anchor="middle" font-size="15" font-weight="700" fill="white">03</text><text x="670" y="182" font-size="19" font-weight="700" fill="#0f172a">Normalize</text><text x="625" y="225" font-size="14" fill="#475569">Dates • amounts • entities • currency</text><rect x="870" y="145" width="240" height="145" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="905" cy="180" r="20" fill="#2563eb"/><text x="905" y="187" text-anchor="middle" font-size="15" font-weight="700" fill="white">04</text><text x="940" y="182" font-size="19" font-weight="700" fill="#0f172a">Canonical model</text><text x="895" y="225" font-size="14" fill="#475569">Stable transaction contract + lineage</text>
<path d="M300 215 H320 M570 215 H590 M840 215 H860" stroke="#2563eb" stroke-width="4"/>

<text x="60" y="355" font-size="25" font-weight="700" fill="#0f172a">Matching layers</text>
<circle cx="82" cy="NaN" r="18" fill="#0f766e"/><text x="82" y="NaN" text-anchor="middle" font-size="14" font-weight="700" fill="white">1</text><text x="115" y="NaN" font-size="18" font-weight="700" fill="#0f172a">Candidate blocking</text><text x="430" y="NaN" font-size="15" fill="#475569">Reduce search space before expensive comparisons</text><circle cx="82" cy="NaN" r="18" fill="#0f766e"/><text x="82" y="NaN" text-anchor="middle" font-size="14" font-weight="700" fill="white">2</text><text x="115" y="NaN" font-size="18" font-weight="700" fill="#0f172a">Exact matching</text><text x="430" y="NaN" font-size="15" fill="#475569">Reference / amount / date / counterparty evidence</text><circle cx="82" cy="NaN" r="18" fill="#0f766e"/><text x="82" y="NaN" text-anchor="middle" font-size="14" font-weight="700" fill="white">3</text><text x="115" y="NaN" font-size="18" font-weight="700" fill="#0f172a">Fuzzy matching</text><text x="430" y="NaN" font-size="15" fill="#475569">Conservative similarity + tolerance scoring</text><circle cx="82" cy="NaN" r="18" fill="#0f766e"/><text x="82" y="NaN" text-anchor="middle" font-size="14" font-weight="700" fill="white">4</text><text x="115" y="NaN" font-size="18" font-weight="700" fill="#0f172a">Complex matching</text><text x="430" y="NaN" font-size="15" fill="#475569">One-to-many and partial-payment handling</text>
<rect x="1010" y="350" width="320" height="250" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="1040" y="390" font-size="20" font-weight="700" fill="#0f172a">Decision boundary</text>
<text x="1040" y="430" font-size="16" fill="#166534">✓ MATCHED</text>
<text x="1040" y="470" font-size="16" fill="#b45309">→ REVIEW</text>
<text x="1040" y="510" font-size="16" fill="#b91c1c">× UNMATCHED</text>
<line x1="1040" y1="535" x2="1300" y2="535" stroke="#cbd5e1"/>
<text x="1040" y="565" font-size="14" fill="#475569">AI is only used for ambiguous</text>
<text x="1040" y="585" font-size="14" fill="#475569">review cases; humans retain control.</text>
</g></svg>