<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
<rect width="1400" height="620" fill="#f8fafc"/>
<text x="60" y="60" font-family="Arial" font-size="32" font-weight="700" fill="#0f172a">03 · Deployment &amp; AI Decision Boundary</text>
<text x="60" y="92" font-family="Arial" font-size="18" fill="#475569">Production-style runtime with a conservative AI boundary</text>
<rect x="60" y="145" width="1280" height="180" rx="20" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="90" y="180" font-family="Arial" font-size="20" font-weight="700" fill="#0f172a">Application runtime</text>
<rect x="100" y="205" width="160" height="82" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="180" y="238" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1e3a8a">Client</text><text x="180" y="263" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">HTTPS / API</text><rect x="330" y="205" width="160" height="82" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="410" y="238" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1e3a8a">FastAPI</text><text x="410" y="263" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">Auth + rate limit</text><rect x="560" y="205" width="160" height="82" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="640" y="238" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1e3a8a">PostgreSQL</text><text x="640" y="263" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">Jobs + reviews + audit</text><rect x="790" y="205" width="160" height="82" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="870" y="238" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1e3a8a">Redis</text><text x="870" y="263" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">Queue / broker</text><rect x="1020" y="205" width="160" height="82" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="1100" y="238" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1e3a8a">Celery</text><text x="1100" y="263" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">Async reconciliation</text><rect x="1190" y="205" width="160" height="82" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="1270" y="238" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1e3a8a">Object store</text><text x="1270" y="263" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">Raw files + reports</text>
<path d="M260 246 H315" stroke="#2563eb" stroke-width="3"/><path d="M490 246 H545" stroke="#2563eb" stroke-width="3"/><path d="M720 246 H775" stroke="#2563eb" stroke-width="3"/><path d="M950 246 H1005" stroke="#2563eb" stroke-width="3"/><path d="M1170 246 H1225" stroke="#2563eb" stroke-width="3"/>
<text x="60" y="390" font-family="Arial" font-size="25" font-weight="700" fill="#0f172a">AI boundary</text>
<rect x="60" y="420" width="280" height="100" rx="14" fill="#ecfdf5" stroke="#86efac"/><text x="200" y="458" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#166534">Deterministic match</text><text x="200" y="484" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Authoritative evidence</text>
<path d="M340 470 H470" stroke="#64748b" stroke-width="3"/>
<rect x="470" y="420" width="280" height="100" rx="14" fill="#fff7ed" stroke="#fdba74"/><text x="610" y="458" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#9a3412">Ambiguous case</text><text x="610" y="484" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Escalate, don't auto-match</text>
<path d="M750 470 H880" stroke="#64748b" stroke-width="3"/>
<rect x="880" y="420" width="200" height="100" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/><text x="980" y="458" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#6d28d9">AI reviewer</text><text x="980" y="484" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Structured advisory output</text>
<path d="M1080 470 H1180" stroke="#64748b" stroke-width="3"/>
<rect x="1180" y="420" width="160" height="100" rx="14" fill="#fff" stroke="#94a3b8"/><text x="1260" y="458" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#0f172a">Human</text><text x="1260" y="484" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Approve / reject</text>
<text x="60" y="575" font-family="Arial" font-size="15" fill="#64748b">AI recommendations remain advisory; final ambiguous financial decisions stay human-controlled and auditable.</text>
</svg>