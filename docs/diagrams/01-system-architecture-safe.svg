<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
<rect width="1400" height="620" fill="#f8fafc"/>
<text x="60" y="60" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#0f172a">01 · End-to-End System Architecture</text>
<text x="60" y="92" font-family="Arial,sans-serif" font-size="18" fill="#475569">From financial inputs to reconciled, auditable decisions</text>
<g><rect x="60" y="160" width="180" height="260" rx="16" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="78" y="198" font-family="Arial" font-size="20" font-weight="700" fill="#0f172a">Data Sources</text><line x1="78" y1="216" x2="222" y2="216" stroke="#e2e8f0"/><rect x="78" y="240" width="144" height="38" rx="8" fill="#eff6ff"/><text x="150" y="265" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">Bank CSV/PDF</text><rect x="78" y="292" width="144" height="38" rx="8" fill="#eff6ff"/><text x="150" y="317" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">Invoices / Tally</text><rect x="78" y="344" width="144" height="38" rx="8" fill="#eff6ff"/><text x="150" y="369" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">GST / Accounting</text></g><g><rect x="290" y="160" width="180" height="260" rx="16" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="308" y="198" font-family="Arial" font-size="20" font-weight="700" fill="#0f172a">Ingestion and Validation</text><line x1="308" y1="216" x2="452" y2="216" stroke="#e2e8f0"/><rect x="308" y="240" width="144" height="38" rx="8" fill="#eff6ff"/><text x="380" y="265" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">Schema checks</text><rect x="308" y="292" width="144" height="38" rx="8" fill="#eff6ff"/><text x="380" y="317" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">Data quality</text><rect x="308" y="344" width="144" height="38" rx="8" fill="#eff6ff"/><text x="380" y="369" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">Fingerprint + idempotency</text></g><g><rect x="520" y="160" width="180" height="260" rx="16" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="538" y="198" font-family="Arial" font-size="20" font-weight="700" fill="#0f172a">Canonical Data Layer</text><line x1="538" y1="216" x2="682" y2="216" stroke="#e2e8f0"/><rect x="538" y="240" width="144" height="38" rx="8" fill="#eff6ff"/><text x="610" y="265" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">Normalized transactions</text><rect x="538" y="292" width="144" height="38" rx="8" fill="#eff6ff"/><text x="610" y="317" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">Lineage + source IDs</text><rect x="538" y="344" width="144" height="38" rx="8" fill="#eff6ff"/><text x="610" y="369" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">Versioned contract</text></g><g><rect x="750" y="160" width="180" height="260" rx="16" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="768" y="198" font-family="Arial" font-size="20" font-weight="700" fill="#0f172a">Reconciliation Engine</text><line x1="768" y1="216" x2="912" y2="216" stroke="#e2e8f0"/><rect x="768" y="240" width="144" height="38" rx="8" fill="#eff6ff"/><text x="840" y="265" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">Candidate blocking</text><rect x="768" y="292" width="144" height="38" rx="8" fill="#eff6ff"/><text x="840" y="317" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">Exact + fuzzy</text><rect x="768" y="344" width="144" height="38" rx="8" fill="#eff6ff"/><text x="840" y="369" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">One-to-many / partial</text></g><g><rect x="980" y="160" width="180" height="260" rx="16" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="998" y="198" font-family="Arial" font-size="20" font-weight="700" fill="#0f172a">Decision Layer</text><line x1="998" y1="216" x2="1142" y2="216" stroke="#e2e8f0"/><rect x="998" y="240" width="144" height="38" rx="8" fill="#eff6ff"/><text x="1070" y="265" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">MATCHED</text><rect x="998" y="292" width="144" height="38" rx="8" fill="#eff6ff"/><text x="1070" y="317" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">REVIEW</text><rect x="998" y="344" width="144" height="38" rx="8" fill="#eff6ff"/><text x="1070" y="369" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">UNMATCHED</text></g><g><rect x="1210" y="160" width="180" height="260" rx="16" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="1228" y="198" font-family="Arial" font-size="20" font-weight="700" fill="#0f172a">Audit and Outputs</text><line x1="1228" y1="216" x2="1372" y2="216" stroke="#e2e8f0"/><rect x="1228" y="240" width="144" height="38" rx="8" fill="#eff6ff"/><text x="1300" y="265" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">Results + reports</text><rect x="1228" y="292" width="144" height="38" rx="8" fill="#eff6ff"/><text x="1300" y="317" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">Audit events</text><rect x="1228" y="344" width="144" height="38" rx="8" fill="#eff6ff"/><text x="1300" y="369" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">Human review queue</text></g>
