name: Scalability Benchmark - Parallel Scale Gates

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/run_scale_benchmark.py"
      - ".github/workflows/scalability-benchmark-parallel.yml"

jobs:
  scale-250k:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: python scripts/run_scale_benchmark.py --cases 250000 --seed 42 --output scale-250k.json
      - uses: actions/upload-artifact@v4
        with:
          name: scalability-250k
          path: scale-250k.json

  scale-500k:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: python scripts/run_scale_benchmark.py --cases 500000 --seed 42 --output scale-500k.json
      - uses: actions/upload-artifact@v4
        with:
          name: scalability-500k
          path: scale-500k.json

  scale-1m:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: python scripts/run_scale_benchmark.py --cases 1000000 --seed 42 --output scale-1m.json
      - uses: actions/upload-artifact@v4
        with:
          name: scalability-1m
          path: scale-1m.json
