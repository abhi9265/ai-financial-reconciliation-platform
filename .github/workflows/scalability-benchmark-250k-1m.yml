name: Scalability Benchmark - 250K to 1M

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/run_scale_benchmark.py"
      - ".github/workflows/scalability-benchmark-250k-1m.yml"

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run 250K, 500K and 1M benchmark
        run: |
          python scripts/run_scale_benchmark.py \
            --cases 250000 500000 1000000 \
            --seed 42 \
            --output scale-results.json
      - name: Upload scale evidence
        uses: actions/upload-artifact@v4
        with:
          name: scalability-benchmark-250k-1m
          path: scale-results.json
