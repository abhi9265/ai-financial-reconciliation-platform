<text x="90" y="540" font-family="Arial" font-size="16" fill="#334155">FastAPI  →  PostgreSQL  →  Redis  →  Celery workers  →  Object storage</text>
<text x="90" y="565" font-family="Arial" font-size="14" fill="#64748b">Tenant-scoped state • asynchronous jobs • structured audit • metrics</text>
