name: Final 1M Scalability Evidence

on:
  pull_request:
    paths:
      - "scripts/run_scale_benchmark.py"
      - "src/reconciliation_platform/reconciliation/**"
      - ".github/workflows/scale-1m-final.yml"
  workflow_dispatch:

jobs:
  scale-1m:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: python scripts/run_scale_benchmark.py --cases 1000000 --seed 42 --output scale-1m.json
      - uses: actions/upload-artifact@v4
        with:
          name: scale-1m-final
          path: scale-1m.json
