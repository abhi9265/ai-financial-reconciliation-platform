<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><rect width="1400" height="650" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#102a5c}.t{font-size:28px;font-weight:700}.h{font-size:17px;font-weight:700}.b{font-size:13px}.s{font-size:11px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.sub{fill:#eef6ff;stroke:#cfe1f5}</style><text x="50" y="48" class="t">2. Data Engineering Flow</text><text x="50" y="73" class="s">How heterogeneous financial files become a clean, match-ready canonical transaction model</text>
<g transform="translate(45,120)"><rect class="box" width="220" height="330" rx="15"/><text x="20" y="34" class="h">Raw Data</text><rect class="sub" x="20" y="58" width="180" height="58" rx="9"/><text x="35" y="84" class="b">CSV / Excel</text><text x="35" y="102" class="s">Bank and accounting exports</text><rect class="sub" x="20" y="130" width="180" height="58" rx="9"/><text x="35" y="156" class="b">PDF statements</text><text x="35" y="174" class="s">Semi-structured inputs</text><rect class="sub" x="20" y="202" width="180" height="58" rx="9"/><text x="35" y="228" class="b">GST / Tally / ERP</text><text x="35" y="246" class="s">Invoice and ledger data</text></g>
<g transform="translate(300,120)"><rect class="box" width="220" height="330" rx="15"/><text x="20" y="34" class="h">Validation &amp; Parsing</text><text x="25" y="75" class="b">✓ Schema checks</text><text x="25" y="110" class="b">✓ Data cleaning</text><text x="25" y="145" class="b">✓ Format parsing</text><text x="25" y="180" class="b">✓ Error handling</text><text x="25" y="215" class="b">✓ Required-field rules</text><text x="25" y="250" class="b">✓ Duplicate detection</text><text x="25" y="285" class="b">✓ Source fingerprinting</text></g>
<g transform="translate(555,120)"><rect class="box" width="260" height="330" rx="15"/><text x="20" y="34" class="h">Normalization</text><rect class="sub" x="20" y="58" width="220" height="55" rx="9"/><text x="35" y="83" class="b">Date formats</text><text x="35" y="101" class="s">Timezone and transaction-date rules</text><rect class="sub" x="20" y="126" width="220" height="55" rx="9"/><text x="35" y="151" class="b">Amount standardization</text><text x="35" y="169" class="s">Decimal, sign and currency handling</text><rect class="sub" x="20" y="194" width="220" height="55" rx="9"/><text x="35" y="219" class="b">Entity resolution</text><text x="35" y="237" class="s">Vendor / customer normalization</text><rect class="sub" x="20" y="262" width="220" height="45" rx="9"/><text x="35" y="289" class="b">Field standardization</text></g>
<g transform="translate(850,120)"><rect class="box" width="300" height="330" rx="15"/><text x="20" y="34" class="h">Canonical Transaction Model</text><rect class="sub" x="20" y="58" width="260" height="55" rx="9"/><text x="35" y="83" class="b">Unified schema</text><text x="35" y="101" class="s">Stable contract across all sources</text><rect class="sub" x="20" y="126" width="260" height="55" rx="9"/><text x="35" y="151" class="b">Deduplication + lineage</text><text x="35" y="169" class="s">Source IDs, hashes, batch metadata</text><rect class="sub" x="20" y="194" width="260" height="55" rx="9"/><text x="35" y="219" class="b">Enrichment</text><text x="35" y="237" class="s">Counterparty and business context</text><rect class="sub" x="20" y="262" width="260" height="45" rx="9"/><text x="35" y="289" class="b">Ready for matching</text></g>
<g stroke="#2563eb" stroke-width="4"><path d="M265 285h35m-10-9 10 9-10 9"/><path d="M520 285h35m-10-9 10 9-10 9"/><path d="M815 285h35m-10-9 10 9-10 9"/></g><rect x="45" y="500" width="1105" height="75" rx="14" fill="#eaf4ff" stroke="#9cc9f5"/><text x="70" y="530" class="h">Data engineering principle</text><text x="70" y="553" class="s">Absorb source-specific complexity upstream so reconciliation operates on deterministic, normalized records.</text></svg>