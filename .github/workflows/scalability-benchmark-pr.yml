name: Scalability Benchmark PR

on:
  pull_request:
    paths:
      - "scripts/run_scale_benchmark.py"
      - "src/reconciliation_platform/reconciliation/**"
      - "src/reconciliation_platform/evaluation/**"
      - ".github/workflows/scalability-benchmark-pr.yml"
  workflow_dispatch:

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run 10K and 100K benchmarks
        run: python scripts/run_scale_benchmark.py --cases 10000 100000 --seed 42 --output scale-results.json
      - name: Upload measured results
        uses: actions/upload-artifact@v4
        with:
          name: scalability-benchmark-10k-100k
          path: scale-results.json
