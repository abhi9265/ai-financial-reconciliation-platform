name: Deployment Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".env.example"
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/deployment-validation.yml"

permissions:
  contents: read

jobs:
  container-and-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: |
          POSTGRES_PASSWORD=ci-password           RECONCILIATION_API_KEY=ci-api-key           docker compose config --quiet

      - name: Build application image
        run: docker build --tag reconciliation-platform:ci .

      - name: Smoke test image
        run: |
          docker run --rm reconciliation-platform:ci             python -c "from reconciliation_platform.api.app import app; print(app.title)"

      - name: Verify no secrets are present in image environment
        run: |
          test -z "$(docker run --rm reconciliation-platform:ci env | grep -E '^(OPENAI_API_KEY|RECONCILIATION_API_KEY)=' || true)"
