name: Deployment Smoke Validation

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "src/reconciliation_platform/api/**"
      - ".env.example"
      - ".github/workflows/deployment-smoke.yml"
  workflow_dispatch:

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Create CI environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-postgres-password
          RECONCILIATION_API_KEY=ci-api-key
          EOF
      - name: Start topology
        run: docker compose up -d --build
      - name: Wait for readiness
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/ready; then exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Check health and metrics
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/metrics
      - name: Show topology
        if: always()
        run: docker compose ps
      - name: Tear down
        if: always()
        run: docker compose down -v
