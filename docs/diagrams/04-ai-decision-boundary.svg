<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><rect width="1400" height="650" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#102a5c}.t{font-size:28px;font-weight:700}.h{font-size:17px;font-weight:700}.b{font-size:13px}.s{font-size:11px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}</style><text x="50" y="48" class="t">4. AI Decision Boundary</text><text x="50" y="73" class="s">Deterministic first. AI only for ambiguity. Human approval remains the authoritative control.</text>
