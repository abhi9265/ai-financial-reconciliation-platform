name: Scalability Benchmark

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Space-separated deterministic case counts"
        required: false
        default: "10000 100000"

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run scalability benchmark
        run: python scripts/run_scale_benchmark.py --cases ${{ inputs.cases }} --seed 42 --output scale-results.json
      - name: Upload measured results
        uses: actions/upload-artifact@v4
        with:
          name: scalability-benchmark-results
          path: scale-results.json
