name: Security and Container Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and audit tooling
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e .
          python -m pip install pip-audit
          python -m pip uninstall -y ai-financial-reconciliation-platform
      - name: Audit Python dependencies
        run: pip-audit --strict --skip-editable

  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install static security tooling
        run: python -m pip install bandit
      - name: Run Bandit
        run: bandit -r src -ll -ii

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build --pull -t reconciliation-platform:${{ github.sha }} .
      - name: Validate Compose configuration
        env:
          RECONCILIATION_API_KEY: ci-only-placeholder
          POSTGRES_PASSWORD: ci-only-postgres-password
          RATE_LIMIT_BACKEND: redis
        run: docker compose config
      - name: Inspect container user
        run: |
          test "$(docker run --rm reconciliation-platform:${{ github.sha }} id -u)" = "10001"
      - name: Scan production image with Trivy
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo:ro" aquasec/trivy:0.66.0 image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /repo/.trivyignore reconciliation-platform:${{ github.sha }}

  dast-zap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: container-build
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build --pull -t reconciliation-platform:zap .
      - name: Start isolated API target
        run: |
          docker run -d --name reconciliation-zap-target             -p 8000:8000             -e API_KEY_REQUIRED=false             -e RECONCILIATION_DB=/tmp/reconciliation.db             -e OBJECT_STORE=local             -e OBJECT_STORE_PATH=/tmp/reconciliation-objects             reconciliation-platform:zap
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs reconciliation-zap-target
          exit 1
      - name: Run OWASP ZAP baseline scan
        run: |
          mkdir -p reports
          docker run --rm             --add-host=host.docker.internal:host-gateway             -v "$PWD/reports:/zap/wrk:rw"             ghcr.io/zaproxy/zaproxy:stable             zap-baseline.py             -t http://host.docker.internal:8000             -J zap-report.json             -r zap-report.html             -I
      - name: Fail on high-risk ZAP findings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/zap-report.json").read_text())
          high = []
          for site in report.get("site", []):
              for alert in site.get("alerts", []):
                  risk = str(alert.get("riskcode", "0"))
                  if risk in {"3", "4"}:
                      high.append({
                          "name": alert.get("name"),
                          "riskcode": risk,
                          "instances": alert.get("instances", []),
                      })
          if high:
              print(json.dumps(high, indent=2))
              raise SystemExit("OWASP ZAP reported high/critical findings")
          print("No high/critical ZAP findings detected.")
          PY
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: reports/
      - name: Cleanup target
        if: always()
        run: docker rm -f reconciliation-zap-target || true
