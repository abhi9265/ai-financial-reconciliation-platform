name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run benchmark regression
        run: python scripts/run_benchmark.py --output benchmark-results.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-benchmark
          path: benchmark-results.json
