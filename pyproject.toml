[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-financial-reconciliation-platform"
version = "0.3.0"
description = "AI-assisted financial reconciliation platform for Indian SMEs and CA firms"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0,<3.0",
  "pandas>=2.0,<3.0",
  "pyarrow>=16.0,<20.0",
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "openai>=1.100,<3.0",
  "boto3>=1.35,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "celery>=5.4,<6.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
  "pytest-cov>=5.0,<7.0",
  "httpx>=0.27,<1.0",
]

[project.scripts]
reconcile-demo = "reconciliation_platform.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
