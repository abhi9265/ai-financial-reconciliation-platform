<g transform="translate(485,105)"><rect class="box" width="200" height="260" rx="14"/><text x="18" y="32" class="h">Canonical Data Layer</text><rect class="sub" x="15" y="52" width="170" height="52" rx="9"/><text x="28" y="75" class="b">Normalized model</text><text x="28" y="92" class="s">Unified transaction schema</text><rect class="sub" x="15" y="116" width="170" height="52" rx="9"/><text x="28" y="139" class="b">Entity resolution</text><text x="28" y="156" class="s">Customer / vendor identity</text><rect class="sub" x="15" y="180" width="170" height="52" rx="9"/><text x="28" y="203" class="b">Lineage + dedupe</text><text x="28" y="220" class="s">Source IDs and fingerprints</text></g>
